<!DOCTYPE html>
<html><head><meta charset="utf-8" /><title>Capture cost harness</title>
<style>body{font:14px/1.7 ui-monospace,monospace;background:#15151a;color:#e8e8ec;margin:0;padding:28px}
.pass{color:#6ee7a0}.fail{color:#ff7a7a}h1{font:600 16px system-ui}</style></head>
<body>
<h1>Capture cost harness — what the content script does on an idle page</h1>
<pre id="out"></pre>
<script src="/ext/content/shared.js"></script>
<script src="/ext/content/capture.js"></script>
<script>
const out = document.getElementById("out");
const results = [];
const check = (name, ok, detail) => {
  results.push(ok);
  out.innerHTML += `<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name}${detail ? " — " + detail : ""}\n`;
};

const BLOCK = 4096;               // one ScriptProcessor callback
const RATE = 48000;
const silent = new Float32Array(BLOCK);          // digital silence, the common case
const speech = new Float32Array(BLOCK);
for (let i = 0; i < BLOCK; i++) speech[i] = Math.sin(i / 8) * 0.2;

let samples = 0;
const tap = new LiveCaption.AudioTap({ onSamples: () => samples++ });

function time(label, active, block, iterations) {
  tap.active = active;
  tap.primary = null;
  const ds = new LiveCaption.Downsampler(RATE);
  samples = 0;
  const t0 = performance.now();
  for (let i = 0; i < iterations; i++) tap.handleBlock(block, ds, "element", false);
  const ms = performance.now() - t0;
  return { ms, perBlock: ms / iterations, samples };
}

const N = 3000;
const idle = time("idle", false, silent, N);
const busy = time("active", true, silent, N);

check("idle page: silent blocks produce no work downstream", idle.samples === 0);
check("captioning: the same blocks are resampled and forwarded", busy.samples > 0, busy.samples + " chunks");
check("idle cost is a fraction of the active cost",
      idle.perBlock * 3 < busy.perBlock,
      `${(idle.perBlock * 1000).toFixed(1)} µs vs ${(busy.perBlock * 1000).toFixed(1)} µs per block`);

// Per second of an idle page: a ScriptProcessor fires RATE/BLOCK times.
const perSec = RATE / BLOCK;
check("idle overhead under 0.5 ms per second of audio",
      idle.perBlock * perSec < 0.5,
      `${(idle.perBlock * perSec).toFixed(3)} ms/s`);

// The onset of speech must still be caught on the very first loud block.
tap.active = false;
tap.primary = null;
samples = 0;
tap.handleBlock(speech, new LiveCaption.Downsampler(RATE), "element", false);
check("speech onset is not missed while idle", samples > 0);

// A tap that only ever delivers silence must still be detected while idle,
// otherwise cross-origin media would fail silently with no explanation.
let recovered = 0;
tap.active = false;
tap.running = true;          // media is playing
tap.sawAudio = false;
tap.silentBlocks = 0;
tap.ctx = { sampleRate: RATE };
tap.recoverSilentTaps = () => recovered++;
for (let i = 0; i < Math.ceil((RATE / BLOCK) * 6); i++) {
  tap.handleBlock(silent, new LiveCaption.Downsampler(RATE), "element", true);
}
check("a tap stuck on silence is still caught while idle", recovered === 1, recovered + " recovery attempt(s)");
tap.running = false;

// Media that cannot be captured used to make the watchdog mint a new live
// MediaStream every five seconds for ever — and escalating to the Web Audio
// element source silenced the page, because that node outputs silence for
// cross-origin media.
function silentMediaCase(src, crossOrigin) {
  const created = [];
  let elementSourceCalls = 0;
  const makeStream = () => {
    const t = { readyState: "live", stopped: false,
                addEventListener() {}, removeEventListener() {}, stop() { t.stopped = true; } };
    const tracks = [t];
    const s = { getAudioTracks: () => tracks, getTracks: () => tracks };
    created.push(s);
    return s;
  };
  const node = { connect() {}, disconnect() {} };
  const tap = new LiveCaption.AudioTap({ onStatus: (s) => tap.statuses.push(s) });
  tap.statuses = [];
  tap.ctx = {
    sampleRate: RATE, state: "running", destination: {},
    createMediaStreamSource: () => node,
    createMediaElementSource: () => { elementSourceCalls++; return node; },
    createGain: () => ({ gain: {}, connect() {}, disconnect() {} }),
    createScriptProcessor: () => ({ connect() {}, disconnect() {} }),
    resume: () => Promise.resolve(),
    suspend: () => Promise.resolve(),
  };
  tap.bus = node;
  const el = {
    paused: false, muted: false, volume: 1, isConnected: true, readyState: 4,
    currentSrc: src, crossOrigin,
    addEventListener() {}, removeEventListener() {},
    captureStream: () => makeStream(),
  };
  tap.running = true;
  tap.tapElement(el);
  for (let i = 0; i < 6; i++) tap.recoverSilentTaps(); // six watchdog rounds
  return { created, elementSourceCalls, tap, el,
           silentTapReports: tap.statuses.filter((s) => s.error === "silent-tap").length };
}

{
  // wunc.org: the stream comes from another origin with no crossorigin attribute
  const r = silentMediaCase("https://playerservices.streamtheworld.com/api/livestream", null);
  check("cross-origin media: the page is never routed through our graph",
        r.elementSourceCalls === 0, "createMediaElementSource called " + r.elementSourceCalls + " times");
  check("cross-origin media: no stream per retry", r.created.length <= 1,
        r.created.length + " streams over six rounds");
  check("cross-origin media: reported exactly once", r.silentTapReports === 1);
  check("cross-origin media: nothing retries afterwards", r.tap.unsupported.has(r.el));
}

{
  // same-origin media that happens to deliver silence: escalation is safe here
  const r = silentMediaCase(location.origin + "/speech.wav", null);
  check("same-origin media: escalates to the element source once",
        r.elementSourceCalls === 1 && r.tap.taps.get(r.el).method === "elementSource",
        "createMediaElementSource called " + r.elementSourceCalls + " times");
  check("same-origin media: the replaced stream is stopped",
        r.created.every((s) => s.getAudioTracks()[0].stopped));
}

// A player the page loaded without CORS (most radio streams) can still be
// captioned by fetching the same stream ourselves, with CORS, and listening to
// that — never to the speakers.
function streamCloneCase(src, allow, duration = Infinity) {
  const connects = [];
  const destination = { id: "destination" };
  const bus = { id: "bus", connect() {}, disconnect() {} };
  const sourceNode = { connect: (t) => connects.push(t.id || "node"), disconnect() {} };
  const elementSourceArgs = [];
  const tap = new LiveCaption.AudioTap({ onStatus: (s) => tap.statuses.push(s) });
  tap.statuses = [];
  tap.allowStreamClone = allow;
  tap.ctx = {
    sampleRate: RATE, state: "running", destination,
    createMediaStreamSource: () => sourceNode,
    createMediaElementSource: (e) => { elementSourceArgs.push(e); return sourceNode; },
    createGain: () => ({ gain: {}, connect() {}, disconnect() {} }),
    createScriptProcessor: () => ({ connect() {}, disconnect() {} }),
    resume: () => Promise.resolve(),
    suspend: () => Promise.resolve(),
  };
  tap.bus = bus;
  const tracks = [{ readyState: "live", addEventListener() {}, removeEventListener() {}, stop() {} }];
  const el = {
    paused: false, muted: false, volume: 1, isConnected: false, readyState: 4, duration,
    currentSrc: src, crossOrigin: null, currentTime: 0,
    addEventListener() {}, removeEventListener() {},
    captureStream: () => ({ getAudioTracks: () => tracks, getTracks: () => tracks }),
  };
  tap.running = true;
  tap.tapElement(el);
  tap.recoverSilentTaps();
  return { tap, el, connects, elementSourceArgs };
}

{
  const r = streamCloneCase("https://wunc-ice.streamguys1.com/wunc-128.mp3", true);
  check("uncapturable stream: a CORS clone is opened", r.tap.clones.size === 1);
  check("the clone is what goes through Web Audio, not the page's own element",
        r.elementSourceArgs.length === 1 && r.elementSourceArgs[0] !== r.el,
        "createMediaElementSource got " + (r.elementSourceArgs[0] === r.el ? "the page's element" : "our clone"));
  check("the clone asks for CORS", r.tap.clones.get(r.el).clone.crossOrigin === "anonymous");
  check("the clone feeds the recogniser and nothing else",
        r.connects.includes("bus") && !r.connects.includes("destination"), JSON.stringify(r.connects));
  check("the page is told what is happening",
        r.tap.statuses.some((s) => s.info === "stream-clone"));
  r.tap.stop();
  check("stopping captions closes the clone", r.tap.clones.size === 0);
}

{
  // A blob/MSE source was fetched by the page itself, so it counts as
  // same-origin: the element source is safe there and is tried first. There is
  // nothing to re-fetch, so no clone is opened.
  const r = streamCloneCase("blob:https://example.com/9f2c", true);
  check("a blob/MSE source is not re-fetched", r.tap.clones.size === 0);
  check("it escalates to the element source instead",
        r.tap.taps.get(r.el).method === "elementSource");
  r.tap.recoverSilentTaps(); // still silent on the next round
  check("and only then is the user told it cannot be captioned",
        r.tap.statuses.filter((s) => s.error === "silent-tap").length === 1);
}

{
  const r = streamCloneCase("https://wunc-ice.streamguys1.com/wunc-128.mp3", false);
  check("the fallback can be turned off", r.tap.clones.size === 0 &&
        r.tap.statuses.some((s) => s.error === "silent-tap"));
}

// Timers: an idle page should be running none of ours.
const watcher = new LiveCaption.MediaWatcher(() => {});
watcher.start();
check("no polling timer on an idle page", !watcher.timer);
watcher.setPolling(true);
check("polling starts with a caption session", !!watcher.timer);
watcher.setPolling(false);
check("polling stops when the session ends", !watcher.timer);
watcher.stop();

out.innerHTML += `\n${results.filter(Boolean).length}/${results.length} checks passed\n`;
document.title = results.every(Boolean) ? "ALL PASS" : "FAILURES";
</script>
</body></html>
