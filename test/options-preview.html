<!DOCTYPE html>
<html><head><meta charset="utf-8" /><title>Options preview</title></head>
<body>
<script>
/* Renders the real options page against the real settings.js, with only the
 * extension messaging stubbed. ?state=custom starts from the configuration in
 * the bug report (whisper-base.en on WebGPU). */
const store = {};
const listeners = [];
window.browser = {
  storage: {
    local: {
      get: async (k) => (store[k] ? { [k]: store[k] } : {}),
      set: async (o) => { Object.assign(store, o); },
    },
    onChanged: { addListener: (fn) => listeners.push(fn) },
  },
  runtime: {
    getManifest: () => ({ version: "preview" }),
    sendMessage: async (msg) => {
      if (msg.type === "get-state") {
        const settings = await LCSettings.get();
        return { settings, granted: true, modelReady: true,
                 recommended: LCSettings.RECOMMENDED, usingRecommended: LCSettings.isRecommended(settings) };
      }
      if (msg.type === "set-settings") return { ok: true, settings: await LCSettings.set(msg.patch) };
      return {};
    },
  },
  permissions: { request: async () => true },
};
</script>
<script src="/ext/background/settings.js"></script>
<script>
(async () => {
  if (new URLSearchParams(location.search).get("state") === "custom") {
    await LCSettings.set({ model: "onnx-community/whisper-base.en", device: "webgpu" });
  }
  const [html, css] = await Promise.all([
    fetch("/ext/options/options.html").then((r) => r.text()),
    fetch("/ext/options/options.css").then((r) => r.text()),
  ]);
  const doc = new DOMParser().parseFromString(html, "text/html");
  const style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);
  document.body.innerHTML = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, "");
  const s = document.createElement("script");
  s.src = "/ext/options/options.js";
  document.body.appendChild(s);
})();
</script>
</body></html>
