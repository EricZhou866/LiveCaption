<!DOCTYPE html>
<html><head><meta charset="utf-8" /><title>Replay test</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#121216;color:#e8e8ec;margin:0;
min-height:100vh;display:grid;place-content:center;gap:14px;padding:40px}</style></head>
<body>
  <h1>Replay test</h1>
  <p>Plays the clip, waits for it to end, then plays it again — the case where
     captions appear the first time only.</p>
  <audio id="a" src="speech.wav" controls></audio>
  <p id="state">idle</p>
  <script>
    const a = document.getElementById("a");
    const state = document.getElementById("state");
    let round = 0;
    function go() {
      round++;
      console.log("TESTPAGE: play round", round);
      a.currentTime = 0;
      a.play().then(() => { state.textContent = "round " + round; })
              .catch((e) => console.log("TESTPAGE: play failed", e.message));
    }
    a.addEventListener("ended", () => {
      console.log("TESTPAGE: ended round", round);
      setTimeout(go, 6000);
    });
    go();
  </script>
</body></html>
