<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Hand-hinted 16px version of icon.svg: every edge on a whole pixel, so the
       bars stay separate instead of blurring together at toolbar size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="4" fill="url(#bg)" shape-rendering="geometricPrecision"/>
  <g fill="#fff">
    <rect x="4" y="5" width="2" height="3"/>
    <rect x="7" y="3" width="2" height="7"/>
    <rect x="10" y="4" width="2" height="5"/>
    <rect x="3" y="11" width="10" height="2"/>
  </g>
</svg>
