<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Local Live Captions: a sound wave above the caption line it becomes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <g fill="#fff">
    <!-- four bars, 10 wide with 7 gaps, centred on x = 64 like the line below -->
    <rect x="33.5" y="42" width="10" height="22" rx="5"/>
    <rect x="50.5" y="30" width="10" height="46" rx="5"/>
    <rect x="67.5" y="36" width="10" height="34" rx="5"/>
    <rect x="84.5" y="26" width="10" height="54" rx="5"/>
    <rect x="26" y="90" width="76" height="14" rx="7"/>
  </g>
</svg>
